# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# exclude env.py (alembic not yet used)
# and old batch scraper files (scrapy not installed)
exclude: |
  (?x)^(
    indexer/workers/pipeview/env\.py|
    indexer/workers/fetcher/BlacklistRedirectMiddleware\.py|
    indexer/workers/fetcher/batch_spider\.py|
    indexer/workers/fetcher/fetch_worker\.py
  )$

repos:
  # re-resolve X.Y.latest tags to git hashes:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      - id: uv-lock
        args: [--upgrade-package, mc-deploy, --upgrade-package, mc-logging]
  - repo: http://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
  - repo: http://github.com/ambv/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3.13
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        args: []
        language: system
        types: [python]
        require_serial: true
  - repo: http://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: http://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: isort (python)
