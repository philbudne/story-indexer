# NOTE!  If you change requirements in this file, you *MUST* run "make
# requirements" and commit the changed requirements*.txt files!

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "story-indexer"
version = "0.0.1"
requires-python = ">=3.13"

dependencies = [
  #"alembic ~= 1.8.0",		# future pipeview schema management
  "beautifulsoup4 ~= 4.15.0",	# bs4.dammit.UnicodeDammit
  "boto3 ~= 1.43.113",
  "docker ~= 7.1.0",
  "elasticsearch ~= 8.17.2",   # must match ES server major/minor
  "fastapi ~= 0.143.0",	       # pipeview api
  # lxml installed by mediacloud-metadata
  "mc-logging @ git+https://github.com/mediacloud/system-dev-ops@mc-logging-0.2.latest#subdirectory=logging/mc-logging",
  "mediacloud-metadata ~= 2.0.0",
  "pika ~= 1.4.4",
  "psycopg[binary] ~= 3.3.0",	# pipeview db access
  "rabbitmq-admin ~= 0.2",
  "statsd_client ~= 1.0.7",
  #"scrapy ~= 2.11.1",		# rss/batch fetcher
  "sqlalchemy ~= 2.0.0",	# pipeview db orm
  "sentry-sdk ~= 2.72.0",
  "uvicorn ~= 0.54.0",		# pipeview api server
  "warcio ~= 1.7.4",
]

[project.optional-dependencies]
# installed in development venv
# (used to also be installed in pre-commit mypy venv)
# come up with a better name if there's another case!
deploy = [
  "jinja2 ~= 3.1.0",	# for docker-compose.yml creation by deploy.py
  "mc-deploy @ git+https://github.com/mediacloud/system-dev-ops@mc-deploy-0.19.latest#subdirectory=deploy/mc-deploy",
]

# packages installed in development venv, but not pre-commit:
# (uv installs unless --no-dev or UV_NO_DEV set??)
dev = [
  "pre-commit ~= 4.7.0",
  "pytest ~= 9.1.1",
]

# packages for type checking
# (installed in venv mypy is run from)
typing = [
  "boto3-stubs[s3] ~= 1.43.112",
  "mypy ~= 2.4.0",
  "types-lxml ~= 2026.02.16",
  # types-beautifulsoup4 no longer needed
  "types-pika ~= 1.2.0b1",	# Jan 2022!
  # requests stubs no longer needed
]


[tool.isort]
profile = "black"

[tool.mypy]
# NOTE!!! Files excluded (from all prodding) via .pre-commit-config.yaml

# from https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

# look for local stubs to PyPI packages in top level stubs directory
mypy_path = "stubs"

[tool.pip-tools]
allow-unsafe = true
quiet = true
resolver = "backtracking"
upgrade = true
# To enable Hash-Checking-Mode uncomment the following line
# generate-hashes = true

# https://setuptools.pypa.io/en/latest/userguide/package_discovery.html#custom-discovery
[tool.setuptools.packages.find]
where = ["."]
include = ["indexer*"]
exclude = ["indexer.tests*"]
namespaces = false
